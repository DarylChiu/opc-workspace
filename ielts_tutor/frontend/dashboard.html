<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>📊 训练数据库 · IELTS Tutor</title>
<style>
:root {
    --bg:#0f0f1a; --card:#1a1a2e; --border:#2a2a4a;
    --accent:#6c63ff; --accent2:#00d4aa; --text:#e0e0f0;
    --muted:#888; --gold:#ffd700; --danger:#ff6b6b;
    --green:#3fb950; --yellow:#d29922; --amber:#fbbf24;
    --heat0:#1a1a2e; --heat1:#0e4429; --heat2:#006d32; --heat3:#26a641; --heat4:#39d353;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    padding:12px 16px calc(20px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
}
.wrap { width:100%; max-width:1100px; display:flex; flex-direction:column; gap:12px; }
.header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.header h1 { font-size:18px; }
.header .back {
    padding:6px 14px; border-radius:7px; font-size:12px; font-weight:600;
    background:var(--accent); color:#fff; text-decoration:none; white-space:nowrap;
}
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
.card h2 { font-size:13px; color:var(--accent2); margin-bottom:10px; }

/* 周期统计 */
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; }
.stat { background:var(--bg); border-radius:8px; padding:10px 6px; text-align:center; }
.stat .num { font-size:22px; font-weight:800; color:var(--accent2); }
.stat .num.gold { color:var(--gold); }
.stat .num.warn { color:var(--danger); }
.stat .lbl { font-size:10px; color:var(--muted); margin-top:2px; }

/* CTA */
.cta {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(135deg,#1e3a5f,#2d1f4e); border:1px solid var(--accent);
    border-radius:10px; padding:14px;
}
.cta .txt { font-size:14px; font-weight:600; }
.cta .sub { font-size:11px; color:var(--muted); margin-top:2px; }
.cta button {
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    background:var(--accent2); color:#000; font-size:14px; font-weight:700; white-space:nowrap; min-height:42px;
}
.cta button:disabled { opacity:.4; }

/* 双栏布局（趋势+日历） */
.dual-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.chart-box { position:relative; height:160px; }
.legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; font-size:9px; color:var(--muted); }
.legend span::before { content:"●"; margin-right:2px; }
.lg-o::before { color:var(--gold); } .lg-f::before { color:var(--accent2); }
.lg-v::before { color:#4dc9f6; } .lg-p::before { color:#e74c8b; }

/* 日历 */
.heatmap { display:flex; gap:3px; overflow-x:auto; padding-bottom:4px; }
.hm-week { display:flex; flex-direction:column; gap:3px; }
.hm-cell { width:13px; height:13px; border-radius:3px; background:var(--heat0); border:1px solid #22223a; flex-shrink:0; }
.hm-legend { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--muted); margin-top:6px; justify-content:flex-end; }
.hm-legend .hm-cell { width:10px; height:10px; }

/* To Improve 双栏 */
.improve-dual { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.improve-col h3 { font-size:12px; color:var(--amber); margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:6px; }
.review-scroll { max-height:420px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.review-scroll::-webkit-scrollbar { width:4px; }
.review-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
.review-item {
    display:flex; align-items:flex-start; gap:6px; padding:8px 10px;
    background:var(--bg); border-radius:8px; margin-bottom:5px;
    border-left:3px solid var(--yellow); font-size:12px;
}
.review-item.done { border-left-color:var(--green); opacity:.55; }
.review-item .target { font-size:12px; font-weight:600; line-height:1.4; }
.review-item .ctx { font-size:10px; color:var(--muted); margin-top:2px; line-height:1.3; }
.review-item .meta { font-size:9px; color:var(--muted); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; }
.badge { padding:1px 6px; border-radius:9px; font-size:8px; font-weight:700; }
.badge.pending { background:var(--yellow); color:#000; }
.badge.consolidated { background:var(--green); color:#000; }

.filter-row { display:flex; gap:6px; margin-bottom:8px; }
.filter-btn {
    padding:4px 10px; border-radius:14px; font-size:10px; border:1px solid var(--border);
    background:transparent; color:var(--muted); cursor:pointer;
}
.filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 训练模式总结 */
.mode-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; }
.mode-card {
    background:var(--bg); border-radius:10px; padding:12px; border:1px solid var(--border);
    cursor:pointer; transition:border-color .2s;
}
.mode-card:hover { border-color:var(--accent2); cursor:pointer; }
.mode-card .m-name { font-size:13px; font-weight:700; margin-bottom:6px; }
.mode-card .m-stat { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; margin-top:3px; }
.mode-card .m-val { color:var(--text); font-weight:600; }
.mode-card .m-score { color:var(--gold); font-weight:700; }
.mode-card .m-expand { float:right; font-size:16px; color:var(--muted); transition:transform .3s; }
.mode-card .m-detail { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); animation:slideDown .3s ease-out; }
@keyframes slideDown { from{opacity:0;max-height:0} to{opacity:1;max-height:500px} }
.m-detail .eval-item { padding:8px; background:var(--card); border-radius:6px; margin-bottom:6px; }
.m-detail .eval-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.m-detail .eval-date { font-size:11px; color:var(--muted); }
.m-detail .eval-score { font-size:18px; font-weight:700; color:var(--gold); }
.m-detail .eval-bars { margin:6px 0; }
.m-detail .eval-bar-row { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted); margin:2px 0; }
.m-detail .eval-bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.m-detail .eval-fill { height:100%; background:var(--accent2); border-radius:2px; }
.m-detail .eval-summary { font-size:11px; color:var(--text); margin:4px 0; line-height:1.4; }
.m-detail .eval-meta { font-size:10px; color:var(--muted); }
.m-detail .m-empty { font-size:11px; color:var(--muted); text-align:center; padding:8px; }
.m-detail .m-loading { font-size:11px; color:var(--muted); text-align:center; padding:8px; }

.empty { text-align:center; color:var(--muted); font-size:12px; padding:24px 10px; line-height:1.6; }

.demo-tag { display:none; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700;
    background:var(--yellow); color:#000; }
body.demo .demo-tag { display:inline-block; }

@media (max-width:820px) {
    body { padding:8px 8px calc(16px + env(safe-area-inset-bottom)); }
    .header h1 { font-size:15px; }
    .stats-row { grid-template-columns:repeat(3,1fr); }
    .dual-row { grid-template-columns:1fr; }
    .improve-dual { grid-template-columns:1fr; }
    .chart-box { height:140px; }
    .card { padding:11px; }
    .mode-cards { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <h1>📊 训练数据库 <span class="demo-tag">DEMO</span></h1>
        <a class="back" href="/">← 返回训练</a>
    </div>

    <!-- 今日跟读 CTA -->
    <div class="cta" id="ctaBox" style="display:none">
        <div><div class="txt" id="ctaText">今日有 0 条待巩固</div>
        <div class="sub">跟读法巩固 + 词汇Vocabulary复习</div></div>
        <div style="display:flex;gap:6px">
            <button onclick="location.href='/shadow'">跟读 →</button>
            <button onclick="location.href='/vocab'" style="background:var(--amber)">词汇 →</button>
        </div>
    </div>

    <!-- 周期统计 -->
    <div class="card"><h2>📅 本周统计</h2><div class="stats-row" id="statsRow"></div></div>

    <!-- 分数趋势 + 练习日历 (双栏) -->
    <div class="dual-row">
        <div class="card"><h2>📈 分数趋势（近14天）</h2>
            <div class="chart-box"><canvas id="trendChart"></canvas></div>
            <div class="legend"><span class="lg-o">Overall</span><span class="lg-f">Fluency</span><span class="lg-v">Vocabulary</span><span class="lg-p">Pronunciation</span></div>
            <div class="empty" id="trendEmpty" style="display:none">暂无评估数据</div>
        </div>
        <div class="card"><h2>🗓️ 练习日历（近6周）</h2>
            <div class="heatmap" id="heatmap"></div>
            <div class="hm-legend">少 <div class="hm-cell" style="background:var(--heat0)"></div><div class="hm-cell" style="background:var(--heat1)"></div><div class="hm-cell" style="background:var(--heat2)"></div><div class="hm-cell" style="background:var(--heat3)"></div><div class="hm-cell" style="background:var(--heat4)"></div> 多</div>
        </div>
    </div>

    <!-- To Improve 双栏：Sentence + Vocabulary -->
    <div class="card"><h2>🔧 To Improve 累积清单</h2>
        <div class="filter-row">
            <button class="filter-btn active" data-f="all" onclick="setFilter(this)">全部</button>
            <button class="filter-btn" data-f="pending" onclick="setFilter(this)">待巩固</button>
            <button class="filter-btn" data-f="consolidated" onclick="setFilter(this)">已巩固</button>
        </div>
        <div class="improve-dual">
            <div class="improve-col">
                <h3>✏️ Sentence 训练句</h3>
                <div class="review-scroll" id="sentenceList"><div class="empty">—</div></div>
            </div>
            <div class="improve-col">
                <h3>📚 Vocabulary 词汇</h3>
                <div class="review-scroll" id="vocabList"><div class="empty">—</div></div>
            </div>
        </div>
    </div>

    <!-- 训练模式总结 -->
    <div class="card"><h2>📊 训练模式总结</h2>
        <div class="mode-cards" id="modeCards"></div>
        <div class="empty" id="modeEmpty" style="display:none">暂无训练记录</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
if (DEMO) document.body.classList.add('demo');
let reviews = [], vocabItems = [], filter = 'all';

function demoData() {
    const days = [], today = new Date();
    for (let i = 13; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
    const trend = [];
    let base = 5.0;
    days.forEach((day, i) => {
        if (i%2 !== 0) return;
        base += (Math.random()-0.35)*0.3;
        const o = Math.min(7.5,Math.max(4.5,base));
        trend.push({day, overall:+o.toFixed(1), fluency:+(o-0.3+Math.random()*.6).toFixed(1),
            vocabulary:+(o-0.4+Math.random()*.6).toFixed(1), grammar:+(o-0.3+Math.random()*.4).toFixed(1),
            pronunciation:+(o-0.2+Math.random()*.5).toFixed(1)});
    });
    const calendar = days.filter(()=>Math.random()>0.4).map(day=>({day, count:1+Math.floor(Math.random()*3)}));
    return {
        stats: { trend, calendar,
            week:{sessions_7d:9, evals_7d:6, best_7d:6.5},
            review:{total:14, pending:6, consolidated:8, added_today:3} },
        reviews: [
            {id:1,target_text:"I focus on my professional skills",context:"~~I'm coming in at my professional steel~~ → **I focus on my professional skills**",category:"grammar",status:"pending",created_at:days[12]},
            {id:2,target_text:"I like playing video games",context:"~~I like play video~~ → **I like playing video games**",category:"grammar",status:"pending",created_at:days[10]},
            {id:3,target_text:"Could you explain why?",context:"~~Why why?~~ → **Could you explain why?**",category:"grammar",status:"pending",created_at:days[8]},
            {id:4,target_text:"How can I defeat the enemy?",context:"~~How can I receive an evil?~~ → word choice",category:"vocab",status:"consolidated",created_at:days[5]},
        ],
        modeStats: [
            {mode:'ielts_part1', label:'IELTS Part 1', sessions:12, totalTime:'42min', bestScore:6.5, lastPracticed:days[1]},
            {mode:'free_talk', label:'Free Talk', sessions:8, totalTime:'65min', bestScore:null, lastPracticed:days[0]},
            {mode:'business_pitch', label:'Business Pitch', sessions:3, totalTime:'18min', bestScore:5.5, lastPracticed:days[6]},
            {mode:'ielts_part3', label:'IELTS Part 3', sessions:2, totalTime:'10min', bestScore:null, lastPracticed:days[10]},
        ],
        vocabDemo: [
            {id:1,word:'meticulous',source_sentence:'She was meticulous in preparation.',mastered:0,created_at:days[3]},
            {id:2,word:'profound',source_sentence:'That was a profound insight.',mastered:0,created_at:days[2]},
            {id:3,word:'articulate',source_sentence:'She can articulate her ideas clearly.',mastered:0,created_at:days[1]},
        ]
    };
}

function renderStats(s) {
    const w=s.week||{}, r=s.review||{};
    document.getElementById('statsRow').innerHTML=`
        <div class="stat"><div class="num">${w.sessions_7d||0}</div><div class="lbl">本周练习</div></div>
        <div class="stat"><div class="num">${w.evals_7d||0}</div><div class="lbl">完成评估</div></div>
        <div class="stat"><div class="num gold">${w.best_7d?(+w.best_7d).toFixed(1):'—'}</div><div class="lbl">本周最高分</div></div>
        <div class="stat"><div class="num warn">${r.pending||0}</div><div class="lbl">待巩固</div></div>
        <div class="stat"><div class="num">${r.consolidated||0}</div><div class="lbl">已巩固</div></div>
        <div class="stat"><div class="num">${r.added_today||0}</div><div class="lbl">今日新增</div></div>`;
    if (r.pending > 0 || vocabItems.filter(v=>!v.mastered).length > 0) {
        document.getElementById('ctaBox').style.display='flex';
        const p = r.pending||0, v = vocabItems.filter(x=>!x.mastered).length;
        document.getElementById('ctaText').textContent = `待巩固: ${p} Sentence + ${v} Vocabulary`;
    }
}

function renderTrend(trend) {
    if (!trend||trend.length===0) {
        document.getElementById('trendEmpty').style.display='block';
        document.querySelector('.chart-box').style.display='none';
        return;
    }
    const mk=(key,color)=>({label:key,data:trend.map(t=>t[key]),borderColor:color,backgroundColor:color,tension:.3,pointRadius:2,borderWidth:2});
    new Chart(document.getElementById('trendChart'),{
        type:'line',
        data:{labels:trend.map(t=>t.day.slice(5)),datasets:[mk('overall','#ffd700'),mk('fluency','#00d4aa'),mk('vocabulary','#4dc9f6'),mk('pronunciation','#e74c8b')]},
        options:{responsive:true,maintainAspectRatio:false,
            plugins:{legend:{display:false}},
            scales:{y:{min:4,max:9,ticks:{color:'#888',stepSize:1},grid:{color:'#2a2a4a'}},
                    x:{ticks:{color:'#888',maxTicksLimit:7},grid:{display:false}}}}
    });
}

function renderHeatmap(calendar) {
    const map={}; (calendar||[]).forEach(c=>map[c.day]=c.count);
    const box=document.getElementById('heatmap'), today=new Date();
    const start=new Date(today); start.setDate(start.getDate()-41); // 6周
    while(start.getDay()!==1) start.setDate(start.getDate()-1);
    let html='';
    for(let w=0;w<6;w++){
        html+='<div class="hm-week">';
        for(let d=0;d<7;d++){
            const cur=new Date(start); cur.setDate(cur.getDate()+w*7+d);
            if(cur>today){html+='<div class="hm-cell" style="opacity:0"></div>';continue;}
            const key=cur.toISOString().slice(0,10), n=map[key]||0;
            const lvl=n===0?0:n===1?1:n===2?2:n<=4?3:4;
            html+=`<div class="hm-cell" style="background:var(--heat${lvl})" title="${key}: ${n}次"></div>`;
        }
        html+='</div>';
    }
    box.innerHTML=html;
}

function renderReviewsDual() {
    const all = filter==='all'?reviews:reviews.filter(r=>r.status===filter);
    // Sentence: all review_items (grammar corrections)
    const sentences = all;
    // Vocab: ONLY user-saved vocabulary from vocabulary table (NOT review_items)
    const userVocab = vocabItems.filter(v=>!v.mastered).map(v=>({
        target_text:v.word, context:v.source_sentence||v.better_expression||'', status:v.mastered?'consolidated':'pending',
        category:'user-vocab', created_at:v.created_at
    }));

    const renderCol = (items, containerId) => {
        const box = document.getElementById(containerId);
        if (items.length===0) { box.innerHTML='<div class="empty">—</div>'; return; }
        box.innerHTML = items.slice(0,15).map(r=>`
            <div class="review-item ${r.status==='consolidated'?'done':''}">
                <div style="flex:1">
                    <div class="target">${esc(r.target_text)}</div>
                    <div class="ctx">${fmt(r.context)}</div>
                    <div class="meta">
                        <span class="badge ${r.status}">${r.status==='pending'?'待巩固':'✓'}</span>
                        <span>${(r.created_at||'').slice(5,10)}</span>
                    </div>
                </div>
            </div>`).join('');
    };
    renderCol(sentences, 'sentenceList');
    renderCol(userVocab, 'vocabList');
}

function renderModeSummary(modeStats) {
    const container = document.getElementById('modeCards');
    document.getElementById('modeEmpty').style.display = modeStats.length?'none':'block';
    const labels = {ielts_part1:'📋 Part 1', ielts_part2:'🎤 Part 2', ielts_part3:'💭 Part 3',
        free_talk:'🗣 Free Talk', business_pitch:'💼 Pitch'};
    container.innerHTML = modeStats.map(m=>`
        <div class="mode-card" onclick="toggleModeDetail(this, '${m.mode}')">
            <div class="m-name">${labels[m.mode]||m.mode} <span class="m-expand">›</span></div>
            <div class="m-stat"><span>Sessions</span><span class="m-val">${m.sessions||0}</span></div>
            <div class="m-stat"><span>Total Time</span><span class="m-val">${m.totalTime||'—'}</span></div>
            <div class="m-stat"><span>Best Score</span><span class="m-score">${m.bestScore?m.bestScore.toFixed(1):'—'}</span></div>
            <div class="m-stat"><span>Last</span><span class="m-val">${(m.lastPracticed||'').slice(5)||'—'}</span></div>
            <div class="m-detail" style="display:none"><div class="m-loading">加载中...</div></div>
        </div>`).join('');
}

function setFilter(btn) {
    filter=btn.dataset.f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderReviewsDual();
}

async function toggleModeDetail(card, mode) {
    const detail = card.querySelector('.m-detail');
    const expand = card.querySelector('.m-expand');
    if (detail.style.display !== 'none') {
        detail.style.display = 'none';
        expand.textContent = '›';
        return;
    }
    detail.style.display = 'block';
    expand.textContent = '⌄';
    try {
        const d = await fetch('/api/dashboard/mode-evals?mode=' + mode + '&limit=3').then(r=>r.json());
        const evals = d.evals || [];
        if (!evals.length) {
            detail.innerHTML = '<div class="m-empty">暂无评估记录</div>';
            return;
        }
        const labels = {fluency:'Fluency',vocabulary:'Vocab',grammar:'Grammar',pronunciation:'Pron'};
        detail.innerHTML = evals.map(e=>'<div class="eval-item"><div class="eval-header"><span class="eval-date">📅 '+(e.created_at||'').slice(0,10)+'</span><span class="eval-score">'+(e.overall?e.overall.toFixed(1):'—')+'</span></div><div class="eval-bars">'+['fluency','vocabulary','grammar','pronunciation'].map(k=>'<div class="eval-bar-row"><span>'+labels[k]+'</span><div class="eval-bar"><div class="eval-fill" style="width:'+((e[k]||0)*11.1)+'%"></div></div><span>'+(e[k]||'—')+'</span></div>').join('')+'</div><div class="eval-summary">'+esc((e.summary||'').slice(0,120))+((e.summary||'').length>120?'...':'')+'</div><div class="eval-meta">🔄 '+(e.improvements_count||0)+' to improve · ⭐ '+(e.highlights_count||0)+' highlights</div></div>').join('');
    } catch(err) {
        detail.innerHTML = '<div class="m-empty">加载失败</div>';
    }
}

const esc=s=>(s||'').replace(/</g,'&lt;');
const fmt=s=>esc(s).replace(/~~(.+?)~~/g,'<span style="color:#ff5252;text-decoration:line-through">$1</span>').replace(/\*\*(.+?)\*\*/g,'<span style="color:#4caf50;font-weight:700">$1</span>');

async function load() {
    let stats, revData, vocabData, histData;
    if (DEMO) {
        const d=demoData();
        stats=d.stats; revData={reviews:d.reviews};
        vocabItems=d.vocabDemo||[];
        stats.modeStats=d.modeStats;
        histData={history:[]};
    } else {
        [stats, revData, vocabData, histData] = await Promise.all([
            fetch('/api/dashboard/stats?days=14').then(r=>r.json()),
            fetch('/api/dashboard/reviews?limit=200').then(r=>r.json()),
            fetch('/api/vocab/list?limit=100&mastered=0').then(r=>r.json()),
            fetch('/api/dashboard/history?limit=200').then(r=>r.json()),
        ]);
        vocabItems = vocabData.items || [];
        // Build mode stats from history
        const modeMap = {};
        (histData.history||[]).forEach(h=>{
            const m = h.mode||'unknown';
            if (!modeMap[m]) modeMap[m] = {mode:m, sessions:0, totalTime:0, bestScore:0, lastPracticed:''};
            modeMap[m].sessions++;
            if (h.overall && h.overall > modeMap[m].bestScore) modeMap[m].bestScore = h.overall;
            if (!modeMap[m].lastPracticed || h.created_at > modeMap[m].lastPracticed) modeMap[m].lastPracticed = h.created_at;
        });
        stats.modeStats = Object.values(modeMap);
    }
    renderStats(stats);
    renderTrend(stats.trend);
    renderHeatmap(stats.calendar);
    reviews = revData.reviews || [];
    renderReviewsDual();
    renderModeSummary(stats.modeStats||[]);
}
load();
</script>
</body>
</html>

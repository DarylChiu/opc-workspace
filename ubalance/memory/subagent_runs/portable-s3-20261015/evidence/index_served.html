<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUATEX 本地工具台</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--line:#dfe3e8;--pri:#1f6feb;--pri2:#0b4fc4;
        --ok:#1a7f37;--warn:#9a6700;--err:#c62828;--mut:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#1f2328;
       font:14px/1.6 "Microsoft YaHei","PingFang SC","Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;
        padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;
       border-radius:50%;background:var(--pri);color:#fff;font-size:12px}
  label{display:block;font-size:13px;margin:8px 0 4px;color:#333}
  input[type=text],select,input[type=file]{width:100%;padding:7px 9px;border:1px solid var(--line);
       border-radius:6px;font-size:13px;background:#fff}
  input[type=text]:focus,select:focus{outline:2px solid #cfe0ff;border-color:var(--pri)}
  button{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 16px;
         font-size:14px;cursor:pointer}
  button:hover{background:var(--pri2)}
  button:disabled{background:#9db4d8;cursor:not-allowed}
  button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--mut);font-size:12px}
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;
       border:1px solid var(--line);background:#fafbfc}
  .tag.done{background:#e8f5ec;color:var(--ok);border-color:#bfe3c8}
  .tag.failed{background:#fdecec;color:var(--err);border-color:#f5c2c2}
  .tag.running{background:#eaf2ff;color:var(--pri);border-color:#cfe0ff}
  .tag.queued{background:#fff8e6;color:var(--warn);border-color:#f2e0a8}
  pre{background:#0f172a;color:#d6e2f0;padding:10px;border-radius:6px;font-size:12px;
      max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#fafbfc;color:#444;font-weight:600}
  a{color:var(--pri);text-decoration:none}
  a:hover{text-decoration:underline}
  .files{margin:6px 0 0;font-size:12px;color:var(--mut)}
  .hint{background:#fff8e6;border:1px solid #f2e0a8;border-radius:6px;padding:8px 10px;
        font-size:12.5px;color:var(--warn);margin-top:8px;display:none}
  .ok-msg{color:var(--ok);font-size:12.5px;margin-left:8px}
  .err-msg{color:var(--err);font-size:12.5px;margin-left:8px}
  .bar{height:6px;background:#e8ecf1;border-radius:4px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;width:30%;background:var(--pri);animation:mv 1.1s infinite linear}
  @keyframes mv{0%{margin-left:-30%}100%{margin-left:100%}}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>HUATEX 本地工具台 <span class="tag">S3 最小原型</span></h1>
  <div class="sub">本机使用 · 仅 127.0.0.1 可访问 · 不联网 · 每次运行自动留痕</div>

  <!-- ⓪ 数据文件夹地址 -->
  <div class="card">
    <h2><span class="num">0</span>数据文件夹地址（资料在本机的位置）</h2>
    <label>填写含 <b>RM-Database</b> 的那一层文件夹，例如 <span class="muted">D:\HUATEX</span></label>
    <div class="row">
      <input type="text" id="srcRoot" style="flex:1;min-width:280px" placeholder="例如 D:\HUATEX 或 C:\Users\你\Desktop\HUATEX">
      <button onclick="saveRoot()">保存</button>
    </div>
    <div class="row" style="margin-top:8px">
      <span id="rootMsg" class="ok-msg"></span>
    </div>
    <div class="hint" id="rootHint"></div>
  </div>

  <!-- ① 选择流程 -->
  <div class="card">
    <h2><span class="num">1</span>选择要跑的事情</h2>
    <select id="flow" onchange="switchFlow()">
      <option value="payment">Payment Request（付款核销 → 送银行底稿 / 台账 / 待人工核清单）</option>
      <option value="loan">进出口材料自动化处理（L1 → Outcome1 / Outcome2 / 处理报告）</option>
    </select>
  </div>

  <!-- ② 上传输入 -->
  <div class="card">
    <h2><span class="num">2</span>上传输入文件</h2>
    <div id="payInputs">
      <label>明细 Excel（例如 <span class="muted">10-12华特明细待确认.xlsx</span>）</label>
      <input type="file" id="detail" accept=".xlsx,.xls">
      <label>凭证包（可多选，<span class="muted">voucher-a1013.zip / b1013.zip / c1013.zip</span>）</label>
      <input type="file" id="vouchers" accept=".zip" multiple>
      <label>批次日期（产出文件名用，例如 <span class="muted">20261013</span>；留空则尝试从文件名推断）</label>
      <input type="text" id="payDate" placeholder="YYYYMMDD" style="max-width:200px">
    </div>
    <div id="loanInputs" class="hidden">
      <label>L1 Excel（本批票号清单；二选一）</label>
      <input type="file" id="l1" accept=".xlsx,.xls">
      <label>或 票号 txt（二选一）</label>
      <input type="file" id="tk" accept=".txt,.csv">
      <label>配置档 override（可选，例如回归对拍用 <span class="muted">config.regression-2025_12.yaml</span>）</label>
      <input type="text" id="override" placeholder="留空 = 用 config.yaml；回归填 config.regression-2025_12.yaml">
      <label>批次 tag（可选，留空 = 用配置档里的值）</label>
      <input type="text" id="loanTag" placeholder="例如 2026_10" style="max-width:200px">
    </div>
    <div class="row" style="margin-top:12px">
      <button id="goBtn" onclick="startRun()">开始</button>
      <span class="muted" id="upMsg"></span>
    </div>
  </div>

  <!-- ③ 进度 -->
  <div class="card" id="progCard" style="display:none">
    <h2><span class="num">3</span>进度</h2>
    <div class="row">
      <span id="jobStatus" class="tag queued">排队中</span>
      <span class="muted" id="jobMeta"></span>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <pre id="logBox">（等待中…）</pre>
  </div>

  <!-- ④ 完成 / 下载 -->
  <div class="card" id="doneCard" style="display:none">
    <h2><span class="num">4</span>完成 · 下载产出</h2>
    <div id="artList" class="muted">（无）</div>
    <div id="jobErr" class="err-msg"></div>
  </div>

  <!-- 历史 -->
  <div class="card">
    <h2>运行历史 <span class="muted" style="font-weight:400" id="histHint">（每次运行都留一份 in/out/logs）</span></h2>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>时间</th><th>流程</th><th>状态</th><th>耗时</th><th>产出</th></tr></thead>
        <tbody id="hist"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="ghost" onclick="loadHistory()">刷新</button>
      <span class="muted">产出目录：<code id="runsDir"></code></span>
    </div>
  </div>
</div>

<script>
'use strict';
var token = null;            // 本次上传会话的 token
var curJob = null;           // 当前 job id
var pollTimer = null;

function $(id){ return document.getElementById(id); }
async function api(path, opt){
  opt = opt || {};
  var r = await fetch(path, opt);
  var txt = await r.text();
  try { return JSON.parse(txt); } catch(e){ return {ok:false, error:'非 JSON 响应: '+txt.slice(0,200)}; }
}

/* ---------- ⓪ ---------- */
async function loadState(){
  var s = await api('/api/state');
  if(!s || s.ok === false){ return; }
  $('srcRoot').value = s.source_root || '';
  $('runsDir').textContent = s.runs_dir || '';
  if(s.source_root_hint){ $('rootHint').textContent = '提示：' + s.source_root_hint; }
}
async function saveRoot(){
  var p = $('srcRoot').value.trim();
  var m = $('rootMsg');
  m.className = 'ok-msg'; m.textContent = '校验中…';
  var r = await api('/api/save-source-root', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path:p})
  });
  if(r.ok){ m.className='ok-msg'; m.textContent='✅ 已保存并生效：' + r.source_root; }
  else { m.className='err-msg'; m.textContent='❌ ' + (r.error||'保存失败'); }
}

/* ---------- ① ---------- */
function switchFlow(){
  var f = $('flow').value;
  $('payInputs').className = (f==='payment') ? '' : 'hidden';
  $('loanInputs').className = (f==='loan') ? '' : 'hidden';
  $('progCard').style.display='none';
  $('doneCard').style.display='none';
}

/* ---------- 上传 ---------- */
async function uploadOne(file){
  var headers = {'X-Filename': encodeURIComponent(file.name)};
  if(token) headers['X-Token'] = token;
  var r = await api('/api/upload', {method:'POST', headers:headers, body:file});
  if(!r.ok) throw new Error(r.error || '上传失败');
  token = r.token;
  return r;
}
async function uploadFiles(files, msg){
  var n = 0;
  for(var i=0;i<files.length;i++){
    if(!files[i]) continue;
    msg.textContent = '上传中 ' + (++n) + '/' + files.length + '：' + files[i].name;
    await uploadOne(files[i]);
  }
  return n;
}

/* ---------- ③④ 运行 + 轮询 ---------- */
async function startRun(){
  var f = $('flow').value;
  var msg = $('upMsg'); msg.className='muted';
  var btn = $('goBtn'); btn.disabled = true;
  try {
    token = null;   // 新一次运行 = 新上传会话
    var params = {};
    if(f === 'payment'){
      if(!$('detail').files[0] && !$('vouchers').files.length) throw new Error('请先选择明细 Excel 与凭证 zip');
      if(!$('detail').files[0]) throw new Error('请选择明细 Excel');
      if(!$('vouchers').files.length) throw new Error('请选择凭证 zip（可多选）');
      await uploadFiles([$('detail').files[0]], msg);
      await uploadFiles($('vouchers').files, msg);
      if($('payDate').value.trim()) params.date = $('payDate').value.trim();
    } else {
      var l1 = $('l1').files[0], tk = $('tk').files[0];
      if(!l1 && !tk) throw new Error('请选择 L1 Excel 或 票号 txt');
      await uploadFiles([l1 || tk], msg);
      if($('override').value.trim()) params.override = $('override').value.trim();
      if($('loanTag').value.trim()) params.tag = $('loanTag').value.trim();
    }
    msg.textContent = '提交任务…';
    var r = await api('/api/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({workflow:f, token:token, params:params})
    });
    if(!r.ok) throw new Error(r.error || '提交失败');
    curJob = r.job_id;
    msg.textContent = '已提交：' + curJob;
    $('progCard').style.display='';
    $('doneCard').style.display='none';
    poll();
  } catch(e){
    msg.className = 'err-msg';
    msg.textContent = '❌ ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function statusTag(s){
  var cls = {done:'done', failed:'failed', running:'running', queued:'queued'}[s] || '';
  var zh  = {done:'完成', failed:'失败', running:'运行中', queued:'排队中'}[s] || s;
  return '<span class="tag '+cls+'">'+zh+'</span>';
}
async function poll(){
  if(!curJob) return;
  var r = await api('/api/job?id=' + encodeURIComponent(curJob));
  if(!r.ok){ return; }
  var j = r.job;
  $('jobStatus').outerHTML = '<span id="jobStatus" class="tag">' + j.status + '</span>';
  $('jobStatus').className = 'tag ' + ({done:'done',failed:'failed',running:'running',queued:'queued'}[j.status]||'');
  $('jobStatus').textContent = {done:'完成',failed:'失败',running:'运行中',queued:'排队中'}[j.status]||j.status;
  $('jobMeta').textContent = j.id + (j.elapsed_sec ? ' · ' + j.elapsed_sec + 's' : '');
  $('logBox').textContent = (j.stdout_tail || '') + ((j.stderr_tail) ? '\n--- stderr ---\n' + j.stderr_tail : '');
  $('logBox').scrollTop = $('logBox').scrollHeight;
  $('bar').style.display = (j.status==='running'||j.status==='queued') ? '' : 'none';
  if(j.status === 'done' || j.status === 'failed'){
    renderArtifacts(j);
    loadHistory();
    return;
  }
  pollTimer = setTimeout(poll, 1500);
}

function renderArtifacts(j){
  $('doneCard').style.display='';
  var box = $('artList');
  if(!j.artifacts || !j.artifacts.length){ box.innerHTML = '<span class="muted">（无产出）</span>'; }
  else {
    var h = '<table><thead><tr><th>产出文件</th><th>大小</th><th>操作</th></tr></thead><tbody>';
    for(var i=0;i<j.artifacts.length;i++){
      var a = j.artifacts[i];
      var kb = a.size ? (a.size/1024).toFixed(1)+' KB' : '';
      var url = '/api/download?id=' + encodeURIComponent(j.id) + '&name=' + encodeURIComponent(a.name);
      h += '<tr><td>'+esc(a.name)+'</td><td>'+kb+'</td><td><a href="'+url+'">下载</a></td></tr>';
    }
    box.innerHTML = h + '</tbody></table>';
  }
  $('jobErr').textContent = j.error ? ('错误：' + j.error) : '';
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

async function loadHistory(){
  var r = await api('/api/jobs');
  if(!r.ok){ return; }
  var tb = $('hist');
  if(!r.jobs.length){ tb.innerHTML = '<tr><td colspan="5" class="muted">暂无运行记录</td></tr>'; return; }
  var h = '';
  for(var i=0;i<r.jobs.length;i++){
    var j = r.jobs[i];
    var arts = (j.artifacts||[]).map(function(a){
      return '<a href="/api/download?id='+encodeURIComponent(j.id)+'&name='+encodeURIComponent(a.name)+'">'+esc(a.name)+'</a>';
    }).join('<br>') || '<span class="muted">—</span>';
    h += '<tr><td>'+esc((j.created_at||'').replace('T',' '))+'<br><span class="muted">'+esc(j.id)+'</span></td>'
       + '<td>'+esc(j.workflow_label||j.workflow||'')+'</td>'
       + '<td>'+statusTag(j.status)+'</td>'
       + '<td>'+(j.elapsed_sec!=null? j.elapsed_sec+'s' : '—')+'</td>'
       + '<td>'+arts+'</td></tr>';
  }
  tb.innerHTML = h;
}

loadState();
loadHistory();
switchFlow();
setInterval(loadHistory, 15000);
</script>
</body>
</html>

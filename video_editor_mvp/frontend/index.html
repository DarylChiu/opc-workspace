<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频自动化剪辑MVP · v3.0</title>
<style>
/* ═══════ OPC Design System v1.0 ═══════ */
:root {
  --bg-base: #0f0f13; --bg-surface: #18181d; --bg-elevated: #1e1e24;
  --accent: #6366f1; --accent-hover: #818cf8; --accent-active: #4f46e5;
  --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
  --text-primary: #e4e4e7; --text-secondary: #a1a1aa; --text-muted: #71717a;
  --border: rgba(255,255,255,0.06); --border-strong: rgba(255,255,255,0.10);
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
  --transition: 150ms ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: var(--bg-base); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* Top Bar */
.topbar {
  height: 48px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
}
.topbar .logo { font-weight: 700; font-size: 14px; color: var(--accent); }
.topbar .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--accent); color: white; }
.topbar .status { margin-left: auto; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.topbar .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.topbar .btn { padding: 6px 14px; border-radius: var(--radius-md); font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: var(--transition); }
.topbar .btn-primary { background: var(--accent); color: white; }
.topbar .btn-primary:hover { background: var(--accent-hover); }

/* Main Layout */
.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 56px; background: var(--bg-surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px;
  transition: width var(--transition); flex-shrink: 0;
}
.sidebar:hover { width: 170px; }
.sidebar .step {
  width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer; transition: var(--transition); position: relative; flex-shrink: 0;
  background: transparent; border: none; color: var(--text-muted);
}
.sidebar .step:hover { background: var(--bg-elevated); color: var(--text-primary); }
.sidebar .step.active { background: var(--accent); color: white; }
.sidebar .step.done { background: rgba(34,197,94,0.15); color: var(--green); }
.sidebar .step .label {
  position: absolute; left: 48px; white-space: nowrap; font-size: 11px; opacity: 0; transition: opacity var(--transition);
}
.sidebar:hover .step .label { opacity: 1; }

/* Content */
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Cards */
.card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; margin-bottom: 16px;
}
.card-header { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.card-header .icon { font-size: 16px; }

/* Song Library Grid */
.lib-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;
}
.lib-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px; cursor: pointer; transition: var(--transition);
}
.lib-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.lib-card.selected { border-color: var(--accent); background: rgba(99,102,241,0.08); }
.lib-card .lib-title { font-size: 13px; font-weight: 600; }
.lib-card .lib-artist { font-size: 11px; color: var(--text-secondary); margin: 4px 0; }
.lib-card .lib-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.lib-card .lib-meta span { font-size: 10px; padding: 2px 6px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.04); color: var(--text-muted); }
.lib-card .lib-source { font-size: 9px; color: var(--accent); margin-top: 6px; }

/* Phrase Timeline */
.phrase-timeline {
  position: relative; height: 36px; background: var(--bg-elevated); border-radius: var(--radius-md);
  margin-bottom: 16px; overflow: hidden;
}
.phrase-segment {
  position: absolute; top: 0; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: white; cursor: pointer; transition: opacity var(--transition);
}
.phrase-segment:hover { opacity: 0.8; }

/* Phrase Cards Grid */
.phrase-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px;
}
.phrase-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 14px; cursor: pointer; transition: var(--transition);
}
.phrase-card:hover { border-color: var(--accent-hover); }
.phrase-card.active { border-color: var(--accent); background: rgba(99,102,241,0.06); }
.phrase-card .ph-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.phrase-card .ph-time { font-size: 11px; color: var(--text-muted); }
.phrase-card .ph-energy { margin-top: 8px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.phrase-card .ph-energy-fill { height: 100%; border-radius: 2px; }
.phrase-card .ph-tags { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.phrase-card .ph-tag { font-size: 9px; padding: 1px 6px; border-radius: var(--radius-sm); }
.phrase-card .ph-tag.emotion { background: rgba(99,102,241,0.15); color: var(--accent-hover); }
.phrase-card .ph-tag.highlight { background: rgba(245,158,11,0.15); color: var(--amber); }

/* 8bar units */
.ph-subunits { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.ph-subunit { font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; padding: 2px 0; }

/* Loading / Error */
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.loading .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { padding: 16px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); color: var(--red); font-size: 12px; }
.empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }

/* Energy colors */
.e-low { background: var(--green); } .e-mid { background: var(--amber); } .e-high { background: var(--accent); } .e-peak { background: var(--red); }

/* ═══════ BGM v2 Styles ═══════ */
.audio-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-elevated); border-radius: var(--radius-lg); margin-bottom: 16px; }
.audio-bar .btn-play { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent); color: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); flex-shrink: 0; }
.audio-bar .btn-play:hover { background: var(--accent-hover); }
.audio-bar .btn-play.playing { background: var(--red); }
.audio-bar .time-display { font-size: 11px; color: var(--text-muted); min-width: 88px; text-align: center; font-variant-numeric: tabular-nums; }
.audio-bar .progress-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; cursor: pointer; position: relative; }
.audio-bar .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 150ms linear; }
.audio-bar .progress-wrap:hover { height: 8px; }
.phrase-card-wrap { position: relative; }
.phrase-card-wrap .ph-check { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: var(--radius-sm); border: 2px solid var(--border-strong); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: var(--transition); z-index: 2; }
.phrase-card-wrap .ph-check.checked { background: var(--accent); border-color: var(--accent); color: white; }
.phrase-card-wrap .phrase-card { padding-right: 36px; position: relative; }
.phrase-card-wrap .phrase-card.now-playing { border-color: var(--green); background: rgba(34,197,94,0.06); }
.connect-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.connect-bar .btn { padding: 6px 14px; border-radius: var(--radius-md); font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text-primary); transition: var(--transition); }
.connect-bar .btn:hover { border-color: var(--accent); }
.connect-bar .btn:disabled { opacity: 0.4; cursor: not-allowed; }
.concat-result { margin-top: 12px; padding: 12px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius-md); font-size: 12px; }
.concat-result .concat-name { font-weight: 600; color: var(--green); margin-bottom: 6px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-box { background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 24px; max-width: 560px; width: 90%; max-height: 80vh; overflow-y: auto; }
.modal-box .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.modal-box .modal-close { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--bg-elevated); color: var(--text-muted); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.modal-box .modal-close:hover { background: var(--red); color: white; }
.modal-box .chord-grid { display: grid; grid-template-columns: 48px 1fr; gap: 4px 8px; align-items: center; margin-bottom: 12px; }
.modal-box .chord-tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); background: rgba(99,102,241,0.12); color: var(--accent-hover); font-weight: 600; font-family: 'SF Mono','Consolas',monospace; display: inline-block; }
.modal-box .chord-bar-num { font-size: 10px; color: var(--text-muted); text-align: right; }
.modal-box .info-row { display: flex; gap: 16px; margin-bottom: 16px; font-size: 12px; flex-wrap: wrap; }
.modal-box .info-tag { padding: 3px 10px; border-radius: var(--radius-sm); background: var(--bg-elevated); color: var(--text-secondary); }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <span class="logo">🎬 视频自动化剪辑</span>
  <span class="badge">v3.0</span>
  <span class="status"><span class="dot"></span> API 已连接</span>
  <button class="btn btn-primary" onclick="navigateTo('match')" style="display:none" id="btn-export">🚀 生成Demo</button>
</div>

<!-- Main -->
<div class="main">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"></div>
  
  <!-- Content -->
  <div class="content" id="content"></div>
</div>

<script>
// ═══════════ State ═══════════
const STATE = {
  api: '',
  step: 'bgm',
  bgm: { library: [], selected: null, phrases: [], checked: new Set(), concatResult: null, audio: null, playingPhrase: null },
  scan: { dates: ['20260507','20260508'], results: {} },
};

const STEPS = [
  { id: 'bgm',     icon: '🎼', label: 'BGM 歌曲库' },
  { id: 'scan',    icon: '📁', label: '素材扫描' },
  { id: 'asr',     icon: '🎙️', label: 'ASR+场景' },
  { id: 'emotion', icon: '💗', label: '情感分析' },
  { id: 'match',   icon: '🎬', label: '匹配编排' },
];

// ═══════════ API ═══════════
async function api(path) {
  const r = await fetch(STATE.api + path);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ═══════════ Navigation ═══════════
function navigateTo(step) {
  STATE.step = step;
  render();
}

// ═══════════ Render ═══════════
function render() {
  renderSidebar();
  switch (STATE.step) {
    case 'bgm': renderBGM(); break;
    case 'scan': renderScan(); break;
    case 'asr': renderASR(); break;
    case 'emotion': renderEmotion(); break;
    case 'match': renderMatch(); break;
  }
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = STEPS.map(s => {
    let cls = 'step';
    if (s.id === STATE.step) cls += ' active';
    return `<button class="${cls}" onclick="navigateTo('${s.id}')" title="${s.label}">
      ${s.icon}<span class="label">${s.label}</span>
    </button>`;
  }).join('');
}

// ═══════════ M1: BGM v2 · 播放+和弦+连接 ═══════════

function fmtTime(s) { const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

function getBgmAudioUrl() { return STATE.api+'/api/bgm/audio?path=bgm_full.wav'; }

function ensureAudio() {
  if (!STATE.bgm.audio) {
    STATE.bgm.audio = new Audio(getBgmAudioUrl());
    STATE.bgm.audio.preload = 'auto';
    STATE.bgm.audio.addEventListener('timeupdate', updateBgmProgress);
    STATE.bgm.audio.addEventListener('ended', () => { STATE.bgm.playingPhrase = null; updateBgmUI(); });
    STATE.bgm.audio.addEventListener('loadedmetadata', updateBgmUI);
  }
  return STATE.bgm.audio;
}

function playWholeSong() {
  const a = ensureAudio();
  STATE.bgm.playingPhrase = null;
  if (a.paused) { a.currentTime = 0; a.play(); }
  else a.pause();
  updateBgmUI();
}

function playPhrase(idx, e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  const a = ensureAudio();
  const p = STATE.bgm.phrases[idx];
  if (!p) return;
  
  // 如果正在播同一段 → 暂停
  if (STATE.bgm.playingPhrase === idx && !a.paused) {
    a.pause();
    STATE.bgm.playingPhrase = null;
    updateBgmUI();
    return;
  }
  
  STATE.bgm.playingPhrase = idx;
  a.currentTime = p.start;
  a.play();
  updateBgmUI();
  
  // 播放到该乐句结束时自动停止
  const checkEnd = () => {
    if (a.currentTime >= p.end || a.paused) {
      a.pause();
      STATE.bgm.playingPhrase = null;
      a.removeEventListener('timeupdate', checkEnd);
      updateBgmUI();
    }
  };
  a.addEventListener('timeupdate', checkEnd);
}

function seekBgm(e) {
  const wrap = e.currentTarget;
  const rect = wrap.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const a = ensureAudio();
  if (a.duration) a.currentTime = pct * a.duration;
}

function updateBgmProgress() {
  const a = STATE.bgm.audio;
  if (!a || !a.duration) return;
  const pct = (a.currentTime / a.duration * 100).toFixed(1);
  const el = document.getElementById('bgm-progress');
  if (el) el.style.width = pct + '%';
  const td = document.getElementById('bgm-time');
  if (td) td.textContent = fmtTime(a.currentTime) + ' / ' + fmtTime(a.duration);
  const pb = document.getElementById('bgm-playbtn');
  if (pb) pb.textContent = a.paused ? '▶' : '⏸';
}

function updateBgmUI() {
  updateBgmProgress();
  // 更新乐句卡片的播放状态
  document.querySelectorAll('.phrase-card-wrap .phrase-card').forEach((el, i) => {
    el.classList.toggle('now-playing', STATE.bgm.playingPhrase === i);
  });
  const pb = document.getElementById('bgm-playbtn');
  if (pb && STATE.bgm.audio) pb.textContent = STATE.bgm.audio.paused ? '▶' : '⏸';
}

function togglePhraseCheck(idx) {
  const s = STATE.bgm.checked;
  if (s.has(idx)) s.delete(idx); else s.add(idx);
  renderBGM();
}

async function concatPhrases() {
  const checked = [...STATE.bgm.checked].sort((a,b) => a-b);
  if (!checked.length) return;
  const phraseIds = checked.map(i => STATE.bgm.phrases[i].id);
  try {
    STATE.bgm.concatResult = { loading: true };
    renderBGM();
    const r = await fetch(STATE.api+'/api/bgm/concat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({phrase_ids: phraseIds, song_id: STATE.bgm.selected})
    });
    STATE.bgm.concatResult = await r.json();
    STATE.bgm.checked.clear();
  } catch(e) {
    STATE.bgm.concatResult = { ok: false, error: e.message };
  }
  renderBGM();
}

function showPhraseDetail(idx) {
  const p = STATE.bgm.phrases[idx];
  if (!p) return;
  const chords = p.chord_progression || [];
  const chordRows = chords.length ? chords.map((c,i) => {
    const barNum = Math.floor(i * (p.bars / chords.length)) + 1;
    return '<span class="chord-bar-num">'+barNum+'</span><span class="chord-tag">'+c+'</span>';
  }).join('') : '<span style="color:var(--text-muted)">无和弦数据</span>';
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">
        📋 ${p.label}
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>
      <div class="info-row">
        <span class="info-tag">📏 ${p.bars} bars</span>
        <span class="info-tag">⏱ ${p.start.toFixed(1)}s – ${p.end.toFixed(1)}s</span>
        <span class="info-tag">🎵 ${p.key || '?'}</span>
        <span class="info-tag">🔥 ${(p.energy*100).toFixed(0)}%</span>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">🎹 和弦走向 (每小节)</div>
      <div class="chord-grid">${chordRows}</div>
      <div style="margin-top:16px;font-size:11px;color:var(--text-muted)">
        ${(p.emotion||[]).length ? '情绪: '+p.emotion.join(', ') : ''}
      </div>
    </div>
  `;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}

async function renderBGM() {
  const ct = document.getElementById('content');
  ct.innerHTML = '<div class="loading"><div class="spinner"></div>加载歌曲库...</div>';
  
  try {
    if (!STATE.bgm.library.length) {
      const lib = await api('/api/bgm/library');
      STATE.bgm.library = lib.songs || [];
    }
    if (!STATE.bgm.library.length) { ct.innerHTML = '<div class="empty">📭 歌曲库为空</div>'; return; }
    if (!STATE.bgm.selected) { STATE.bgm.selected = STATE.bgm.library[0].id; await loadPhrases(); }
    
    const song = STATE.bgm.library.find(s => s.id === STATE.bgm.selected);
    const a = STATE.bgm.audio;
    const isPaused = !a || a.paused;
    
    ct.innerHTML = `
      <!-- 歌曲库 -->
      <div class="card">
        <div class="card-header"><span class="icon">🎼</span> 歌曲库</div>
        <div class="lib-grid">
          ${STATE.bgm.library.map(s => `
            <div class="lib-card ${s.id === STATE.bgm.selected ? 'selected' : ''}" onclick="selectSong('${s.id}')">
              <div class="lib-title">🎵 ${s.title}</div>
              <div class="lib-artist">${s.artist}</div>
              <div class="lib-meta">
                <span>⏱ ${(s.duration||0).toFixed(0)}s</span>
                <span>🎹 ${s.key}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      
      <!-- 音频播放器 -->
      <div class="audio-bar" id="audio-bar">
        <button class="btn-play${!isPaused?' playing':''}" id="bgm-playbtn" onclick="playWholeSong()" title="整首播放">${isPaused?'▶':'⏸'}</button>
        <div class="progress-wrap" onclick="seekBgm(event)">
          <div class="progress-fill" id="bgm-progress" style="width:0%"></div>
        </div>
        <div class="time-display" id="bgm-time">0:00 / 0:00</div>
      </div>
      
      <!-- 乐句结构 -->
      ${STATE.bgm.phrases.length ? `
      <div class="card">
        <div class="card-header">
          <span class="icon">📋</span> ${song.title} — ${song.artist}
          <span style="margin-left:auto;font-size:11px;color:var(--text-muted)">${song.bpm}BPM · ${song.key} · ${song.total_bars}bars</span>
        </div>
        
        <!-- 时间轴 -->
        ${renderPhraseTimeline(STATE.bgm.phrases, song)}
        
        <!-- 连接控制 -->
        <div class="connect-bar">
          <button class="btn" onclick="concatPhrases()" ${STATE.bgm.checked.size < 1 ? 'disabled' : ''}>
            🔗 连接选中乐句 (${STATE.bgm.checked.size})
          </button>
          <span style="font-size:10px;color:var(--text-muted)">勾选☑ → 点连接 → 生成新BGM素材</span>
        </div>
        
        <!-- 乐句卡片 -->
        <div class="phrase-grid">
          ${STATE.bgm.phrases.map((p,i) => `
            <div class="phrase-card-wrap">
              <div class="ph-check${STATE.bgm.checked.has(i)?' checked':''}" onclick="event.stopPropagation();togglePhraseCheck(${i})">${STATE.bgm.checked.has(i)?'✓':''}</div>
              <div class="phrase-card${STATE.bgm.playingPhrase===i?' now-playing':''}" ondblclick="showPhraseDetail(${i})">
                <div class="ph-label">${p.label}</div>
                <div class="ph-time">${p.start.toFixed(0)}s – ${p.end.toFixed(0)}s · ${p.duration.toFixed(0)}s</div>
                <div class="ph-energy"><div class="ph-energy-fill ${getEnergyClass(p.energy)}" style="width:${(p.energy*100).toFixed(0)}%"></div></div>
                <div class="ph-tags">${(p.emotion||[]).map(e=>'<span class="ph-tag emotion">'+e+'</span>').join('')}${(p.highlight||[]).map(h=>'<span class="ph-tag highlight">'+h+'</span>').join('')}</div>
                <button class="ph-play-btn" onclick="playPhrase(${i},event)" title="点击播放此乐句">▶ 播放</button>
              </div>
            </div>
          `).join('')}
        </div>
        
        <!-- 连接结果 -->
        ${STATE.bgm.concatResult ? renderConcatResult() : ''}
      </div>
      ` : '<div class="card"><div class="loading"><div class="spinner"></div>加载乐句结构...</div></div>'}
    `;
    
    // 初始化音频并更新进度条
    ensureAudio();
    requestAnimationFrame(updateBgmProgress);
    
  } catch (e) {
    ct.innerHTML = '<div class="error">❌ 加载失败: '+e.message+'</div>';
  }
}

function getEnergyClass(energy) {
  if (energy > 0.75) return 'e-peak';
  if (energy > 0.6) return 'e-high';
  if (energy > 0.45) return 'e-mid';
  return 'e-low';
}

function renderPhraseTimeline(phrases, song) {
  const totalDur = song.duration || phrases[phrases.length-1].end;
  const colors = { 'Intro':'#6366f1','Verse 1':'#818cf8','Verse 2':'#818cf8','Verse 3':'#818cf8','Pre-Chorus 1':'#a78bfa','Pre-Chorus 2':'#a78bfa','Chorus 1':'#f59e0b','Chorus 2':'#ef4444','Outro':'#22c55e' };
  const segments = phrases.map(p => {
    const left = (p.start / totalDur * 100).toFixed(1);
    const width = ((p.end - p.start) / totalDur * 100).toFixed(1);
    return '<div class="phrase-segment" style="left:'+left+'%;width:'+width+'%;background:'+(colors[p.label]||'#6366f1')+'" title="'+p.label+': '+p.start.toFixed(0)+'s-'+p.end.toFixed(0)+'s">'+p.label+'</div>';
  }).join('');
  return '<div class="phrase-timeline">'+segments+'</div>';
}

function renderConcatResult() {
  const r = STATE.bgm.concatResult;
  if (r.loading) return '<div class="concat-result"><div class="loading"><div class="spinner"></div>连接中...</div></div>';
  if (!r.ok) return '<div class="concat-result" style="border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.08)"><span style="color:var(--red)">❌ 连接失败: '+(r.error||'未知')+'</span></div>';
  const names = (r.phrases||[]).map(p=>p.label).join(' + ');
  return `
    <div class="concat-result">
      <div class="concat-name">✅ 连接完成: ${names}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">${r.output_name||''}</div>
      <div class="audio-bar" style="padding:8px 12px;margin-bottom:0">
        <button class="btn-play" onclick="const a=this.nextElementSibling?.querySelector('audio');if(a)a.paused?a.play():a.pause();this.textContent=a.paused?'▶':'⏸'">▶</button>
        <div style="flex:1"><audio src="/output/${r.output_name||''}" style="width:100%;height:24px" controls></audio></div>
      </div>
    </div>
  `;
}

async function selectSong(id) {
  STATE.bgm.selected = id;
  STATE.bgm.phrases = [];
  STATE.bgm.checked.clear();
  STATE.bgm.concatResult = null;
  STATE.bgm.playingPhrase = null;
  if (STATE.bgm.audio) { STATE.bgm.audio.pause(); STATE.bgm.audio = null; }
  await loadPhrases();
  renderBGM();
}

async function loadPhrases() {
  try {
    const data = await api('/api/bgm/phrases?song_id='+STATE.bgm.selected);
    STATE.bgm.phrases = data.phrases || [];
  } catch (e) {
    console.error('loadPhrases error:', e);
  }
}

// ═══════════ M2: SCAN 素材扫描 ═══════════
async function renderScan(){const ct=document.getElementById('content');ct.innerHTML='<div class="loading"><div class="spinner"></div>扫描素材...</div>';try{const dates=STATE.scan.dates;let allFiles=[],allExcluded=[];for(const d of dates){const data=await api('/api/scan/groups?date='+d);for(const g of data.groups||[]){if(!g.name.includes(d.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3')))continue;allFiles.push(...g.files);allExcluded.push(...(g.excluded||[]));}}if(!allFiles.length){ct.innerHTML='<div class="empty">📭 未找到素材</div>';return;}ct.innerHTML='<div class="card"><div class="card-header"><span class="icon">📁</span> 素材扫描 · 2026-05-07 + 2026-05-08 · '+allFiles.length+'个文件</div><div class="lib-grid">'+allFiles.map(f=>'<div class="lib-card"><div style="width:100%;height:100px;background:var(--bg-base);border-radius:var(--radius-sm);margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:24px">🎬</div><div class="lib-title">'+f.id+'.mp4</div><div class="lib-meta"><span>'+f.duration+'s</span><span>'+f.orientation+'</span></div></div>').join('')+'</div>'+(allExcluded.length?'<div style="margin-top:12px;font-size:11px;color:var(--text-muted)">⚠️ 排除 '+allExcluded.length+' 个竖拍素材</div>':'')+'</div>';}catch(e){ct.innerHTML='<div class="error">❌ '+e.message+'</div>';}}
// ═══════════ M3: ASR + Scene ═══════════
async function renderASR(){const ct=document.getElementById('content');ct.innerHTML='<div class="loading"><div class="spinner"></div>加载素材...</div>';try{const dates=STATE.scan.dates;let files=[];for(const d of dates){const data=await api('/api/scan/groups?date='+d);for(const g of data.groups||[]){if(!g.name.includes(d.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3')))continue;files.push(...g.files);}}if(!files.length){ct.innerHTML='<div class="empty">📭 无可用素材</div>';return;}ct.innerHTML='<div class="card"><div class="card-header"><span class="icon">🎙️</span> ASR+场景 · '+files.length+'素材</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">💡 风景Vlog人声极少时自动跳过ASR，保留Gemini场景检测用于转场锚点</div><div class="lib-grid">'+files.map((f,i)=>'<div class="lib-card" id="asr-'+i+'"><div class="lib-title">🎬 '+f.id+'.mp4</div><div class="lib-meta"><span>'+f.duration+'s</span><span>'+f.orientation+'</span></div><div style="font-size:10px;color:var(--text-muted);margin-top:4px" id="asr-status-'+i+'">⏳ 待检测</div></div>').join('')+'</div><button class="btn btn-primary" onclick="runSceneDetection()" style="margin-top:12px">🔍 开始场景检测</button></div><div id="scene-results"></div>';window._asrFiles=files;}catch(e){ct.innerHTML='<div class="error">❌ '+e.message+'</div>';}}
async function runSceneDetection(){const files=window._asrFiles||[],rd=document.getElementById('scene-results');rd.innerHTML='<div class="loading"><div class="spinner"></div>Gemini 场景检测中...</div>';const results=[];for(let i=0;i<files.length;i++){const f=files[i];document.getElementById('asr-status-'+i).innerText='🔄 检测中...';try{const r=await api('/api/scene/detect?path='+encodeURIComponent(f.path));results.push({...f,...r});document.getElementById('asr-status-'+i).innerHTML=r.ok?'✅ '+(r.scenes?.length||0)+'场景 · '+(r.dominant_emotion||''):'⚠️ 失败';}catch(e){document.getElementById('asr-status-'+i).innerText='❌ '+e.message;}}window._sceneResults=results;rd.innerHTML=results.map(r=>r.ok&&r.scenes?'<div class="card"><div class="card-header">🎬 '+r.id+'.mp4 · '+(r.dominant_emotion||'未知')+'</div><div class="phrase-grid">'+r.scenes.map(s=>'<div class="phrase-card"><div class="ph-label">'+(s.description||'未命名')+'</div><div class="ph-time">'+(s.start_sec||0).toFixed(0)+'s–'+(s.end_sec||0).toFixed(0)+'s</div><div class="ph-tags">'+(s.emotion_tags||[]).map(e=>'<span class="ph-tag emotion">'+e+'</span>').join('')+'<span class="ph-tag highlight">'+((s.confidence||0)*100).toFixed(0)+'%</span></div></div>').join('')+'</div></div>':'').join('')||'<div class="empty">无检测结果</div>';}
// ═══════════ M4: Emotion 三层漏斗 ═══════════
async function renderEmotion(){const ct=document.getElementById('content');if(!STATE.bgm.phrases.length){ct.innerHTML='<div class="empty">⚠️ 请先选择歌曲加载乐句结构</div>';return;}ct.innerHTML='<div class="card"><div class="card-header"><span class="icon">📊</span> 分析状态</div><div style="display:flex;gap:20px;font-size:12px" id="emotion-status"><span>⏳ L1: 等待</span><span>⏳ L2: 等待</span><span>⏳ L3: 等待</span><span>🔄 补漏: 0</span></div></div><div class="card"><div class="card-header"><span class="icon">🎵</span> BGM 情绪基调</div><div class="phrase-timeline">'+STATE.bgm.phrases.map(p=>{const cl={Intro:'#6366f1','Verse 1':'#818cf8','Verse 2':'#818cf8','Pre-Chorus 1':'#a78bfa','Pre-Chorus 2':'#a78bfa','Chorus 1':'#f59e0b','Chorus 2':'#ef4444',Outro:'#22c55e'};return'<div class="phrase-segment" style="left:'+(p.start/STATE.bgm.phrases.at(-1).end*100).toFixed(1)+'%;width:'+((p.end-p.start)/STATE.bgm.phrases.at(-1).end*100).toFixed(1)+'%;background:'+(cl[p.label]||'#6366f1')+'">'+p.label+'</div>';}).join('')+'</div></div><div class="card"><div class="card-header"><span class="icon">💗</span> 情感分析</div><button class="btn btn-primary" onclick="runEmotionAnalysis()">🚀 开始三层分析</button><div id="emotion-results" style="margin-top:16px"></div></div><div id="emotion-topp"></div>';}
async function runEmotionAnalysis(){const rd=document.getElementById('emotion-results'),sd=document.getElementById('emotion-status');rd.innerHTML='<div class="loading"><div class="spinner"></div>加载素材+三层分析中...</div>';const dates=STATE.scan.dates,clips=[];for(const d of dates){try{const data=await api('/api/scan/groups?date='+d);for(const g of data.groups||[]){if(!g.name.includes(d.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3')))continue;for(const f of g.files.slice(0,3)){const chunk=Math.min(12,f.duration);for(let t=0;t<f.duration;t+=chunk){const e=Math.min(t+chunk,f.duration);if(e-t>=4)clips.push({path:f.path,start_sec:t,end_sec:e,dialogue_text:'',clip_id:f.id});}}}}catch(e){}}if(!clips.length){rd.innerHTML='<div class="error">没有可分析的素材</div>';return;}const r=await fetch(STATE.api+'/api/emotion/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clips})}),{task_id}=await r.json();let task;do{await new Promise(r=>setTimeout(r,2000));task=await api('/api/task?id='+task_id);if(task.status==='running'){sd.innerHTML='<span>🔄 L1 分析中 ('+task.result?.progress+'%)</span>';rd.innerHTML='<div class="loading"><div class="spinner"></div>'+clips.length+'片段 · '+task.result?.progress+'%</div>';}}while(task.status==='pending'||task.status==='running');if(!task.result?.ok){sd.innerHTML='<span>❌ 失败</span>';rd.innerHTML='<div class="error">'+task.result?.error+'</div>';return;}const d=task.result;sd.innerHTML='<span>✅ L1:'+d.l1_success+'/'+d.total+'</span><span>✅ L2:'+d.total+'</span><span>✅ L3:'+d.total+'</span><span>🔄 补漏:'+(d.l2_l3_candidates||0)+'</span>';window._emotionResults=d.results;rd.innerHTML=buildMatchCards(d.results);}
function buildMatchCards(results){if(!STATE.bgm.phrases.length)return'<div class="empty">无BGM乐句数据</div>';return STATE.bgm.phrases.map(p=>{const be=(p.emotion||[])[0]||'',scored=results.map(r=>{const ce=r.L1?.primary_emotion||'',cf=r.L1?.confidence||0;return{...r,_score:ce===be?cf*100:cf*60}}).sort((a,b)=>b._score-a._score).slice(0,4);return'<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">🎵 '+p.label+' · '+(p.emotion?.[0]||'')+' · '+p.start.toFixed(0)+'s–'+p.end.toFixed(0)+'s '+(p.highlight?.includes('⚡最激昂')?'⚡':'')+(p.highlight?.includes('📖最有叙事感')?'📖':'')+'</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">'+scored.map(s=>'<div class="lib-card" style="font-size:11px;padding:10px"><div style="font-weight:600">🎬 '+(s.path||'').split('/').pop()+'</div><div style="color:var(--text-muted)">'+(s.start_sec||0).toFixed(0)+'s–'+(s.end_sec||0).toFixed(0)+'s</div><div>L1: '+(s.L1?.primary_emotion||'❌')+' ('+((s.L1?.confidence||0)*100).toFixed(0)+'%)</div><div style="margin-top:4px;height:3px;background:var(--border);border-radius:2px"><div style="height:100%;width:'+s._score.toFixed(0)+'%;background:'+(s._score>80?'#22c55e':s._score>60?'#f59e0b':'#ef4444')+';border-radius:2px"></div></div></div>').join('')+'</div></div>'}).join('');}
// ═══════════ M5: Matcher 双轨匹配 + 导出 ═══════════
async function renderMatch(){const ct=document.getElementById('content');if(!STATE.bgm.phrases.length||!window._emotionResults){ct.innerHTML='<div class="empty">⚠️ 请先完成BGM选歌和Emotion分析</div>';return;}ct.innerHTML='<div class="card"><div class="card-header"><span class="icon">🎬</span> 匹配编排 · '+STATE.bgm.phrases.length+' 个乐句槽位</div><button class="btn btn-primary" onclick="runMatcher()">🤖 自动匹配</button><button class="btn" onclick="exportPreview()" style="margin-left:8px">🎥 360p预览</button><button class="btn" onclick="exportFinal()" style="margin-left:8px">🚀 导出1080p</button><div id="match-results" style="margin-top:16px"></div></div>';}
async function runMatcher(){const rd=document.getElementById('match-results');rd.innerHTML='<div class="loading"><div class="spinner"></div>匹配中...</div>';const phrases=STATE.bgm.phrases.map(p=>({label:p.label,start:p.start,end:p.end,duration:p.duration,emotion:p.emotion,energy:p.energy,highlight:p.highlight}));const r=await fetch(STATE.api+'/api/match/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phrases,clips:window._emotionResults,export:'match'})}),{task_id}=await r.json();let task;do{await new Promise(r=>setTimeout(r,1000));task=await api('/api/task?id='+task_id);}while(task.status==='pending'||task.status==='running');if(!task.result?.ok){rd.innerHTML='<div class="error">'+task.result?.error+'</div>';return;}const matches=task.result.matches;window._matches=matches;rd.innerHTML='<div class="card-header">📋 匹配结果</div>'+matches.map(m=>{const p=m.phrase,a=m.auto_pick;return'<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;margin:3px 0;background:var(--bg-elevated);border-radius:var(--radius-md);font-size:11px"><span style="font-weight:600;min-width:90px">🎵 '+p.label+'</span><span style="color:var(--text-muted);min-width:55px">'+p.start.toFixed(0)+'s–'+p.end.toFixed(0)+'s</span><span style="flex:1;color:var(--text-muted)">'+(a?'🎬 '+(a.path||'').split('/').pop()+' '+(a.start_sec||0).toFixed(0)+'s':'无匹配')+'</span><span style="color:'+(m.auto_confidence>=85?'var(--green)':m.auto_confidence>=70?'var(--amber)':'var(--red)')+'">'+m.auto_status+'</span></div>'}).join('');}
async function exportPreview(){if(!window._matches){alert('请先运行自动匹配');return;}const rd=document.getElementById('match-results');rd.innerHTML='<div class="loading"><div class="spinner"></div>渲染360p预览...</div>';const phrases=STATE.bgm.phrases.map(p=>({label:p.label,start:p.start,end:p.end,duration:p.duration,emotion:p.emotion}));const r=await fetch(STATE.api+'/api/match/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phrases,clips:window._emotionResults,export:'preview'})}),{task_id}=await r.json();let task;do{await new Promise(r=>setTimeout(r,2000));task=await api('/api/task?id='+task_id);if(task.status==='running')rd.innerHTML='<div class="loading"><div class="spinner"></div>'+task.result?.status+' '+task.result?.progress+'%</div>';}while(task.status==='pending'||task.status==='running');if(task.result?.preview?.ok){rd.innerHTML='<div class="card"><div class="card-header">✅ 360p 预览完成</div><video controls style="width:100%;max-width:640px" src="/output/preview_360p.mp4?t='+Date.now()+'"></video></div>';}else{rd.innerHTML='<div class="error">❌ 渲染失败</div>';}}
async function exportFinal(){if(!window._matches){alert('请先运行自动匹配');return;}if(!confirm('导出1080p到Toshiba硬盘+Syncthing，约2-3分钟，确认？'))return;const rd=document.getElementById('match-results');rd.innerHTML='<div class="loading"><div class="spinner"></div>渲染1080p...</div>';const phrases=STATE.bgm.phrases.map(p=>({label:p.label,start:p.start,end:p.end,duration:p.duration,emotion:p.emotion}));const lib=await api('/api/bgm/library');const bgmPath=lib.songs?.[0]?.file_path||'';const r=await fetch(STATE.api+'/api/match/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phrases,clips:window._emotionResults,export:'final',bgm_path:bgmPath})}),{task_id}=await r.json();let task;do{await new Promise(r=>setTimeout(r,3000));task=await api('/api/task?id='+task_id);if(task.status==='running')rd.innerHTML='<div class="loading"><div class="spinner"></div>'+task.result?.status+' '+task.result?.progress+'%</div>';}while(task.status==='pending'||task.status==='running');if(task.result?.final?.ok){rd.innerHTML='<div class="card"><div class="card-header">✅ 导出完成</div><div style="font-size:12px;line-height:1.8"><p>📁 '+task.result.final.path+'</p><p>📦 '+task.result.final.size_mb+' MB</p><p>🔄 Syncthing: '+(task.result.final.syncthing?'已同步 → Tab S8':'⚠️ 未配置')+'</p><p>💡 在Tab S8上打开 Video Editor Output 文件夹即可验收</p></div></div>';}else{rd.innerHTML='<div class="error">❌ 导出失败: '+(task.result?.final?.error||'未知')+'</div>';}}

// ═══════════ Init ═══════════
render();
</script>
</body>
